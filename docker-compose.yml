version: '3.8'

services:
  db:
    image: postgres:16
    container_name: billboard_postgres
    restart: always
    environment:
      POSTGRES_DB: billboarddb
      POSTGRES_USER: billboard_admin
      POSTGRES_PASSWORD: StrongProductionPassword123!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billboard_admin -d billboarddb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billboard_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/billboarddb
      SPRING_DATASOURCE_USERNAME: billboard_admin
      SPRING_DATASOURCE_PASSWORD: StrongProductionPassword123!
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data: